[project]
name = "medsam-slicer-backend"
version = "0.1.0"
description = "FastAPI backend for MedSAM Slicer interactive medical image segmentation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "matplotlib>=3.9.0",
    "nibabel>=5.3.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "scikit-image>=0.24.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "sam-2",
]

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git" }
